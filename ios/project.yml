name: Murmur
options:
  bundleIdPrefix: app.murmur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MurmurCore:
    path: MurmurCore
targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - path: Murmur
        excludes:
          - Info.plist
    dependencies:
      - package: MurmurCore
        product: MurmurCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Murmur/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: NO
  MurmurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MurmurCore/Tests/MurmurCoreTests
    dependencies:
      - target: Murmur
      - package: MurmurCore
        product: MurmurCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.murmur.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurTests: [test]
    test:
      config: Debug
      targets:
        - MurmurTests
    run:
      config: Debug
